    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module">
        // Импортируем Three.js и OrbitControls как ES модули
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Создаем глобальный объект для обратной совместимости с существующим кодом
        // THREE namespace не расширяемый, поэтому создаем копию через Object.assign
        const THREE_Global = Object.assign({}, THREE);
        // Добавляем OrbitControls к копии
        THREE_Global.OrbitControls = OrbitControls;
        // Присваиваем глобальной переменной
        window.THREE = THREE_Global;

        // Уведомляем, что Three.js загружен
        window.dispatchEvent(new CustomEvent('threejs-loaded'));
    </script>
