        <div class="modal-overlay" onclick="window.accessibilityService.toggleModal(false)"></div>
        <div class="modal-content">
            <div class="modal-header">

                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="contrastSelect" data-i18n="contrastLabel">Контрасттылық</label>
                    <div class="select-wrapper">
                        <select id="contrastSelect" class="form-select"
                            onchange="window.accessibilityService.setContrast(this.value)">
                            <option value="normal" data-i18n="contrastNormal">Қалыпты</option>
                            <option value="high" data-i18n="contrastHigh">Жоғары</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="textSizeSelect" data-i18n="textSizeLabel">Размер текста</label>
                    <div class="select-wrapper">
                        <select id="textSizeSelect" class="form-select"

                            <option value="normal" data-i18n="textSizeNormal">Қалыпты</option>
                            <option value="large" data-i18n="textSizeLarge">Үлкен</option>
                            <option value="extra-large" data-i18n="textSizeExtraLarge">Өте үлкен</option>
                        </select>
                    </div>
                </div>
                <div class="form-group checkbox-group">
                    <label class="checkbox-label"
                        style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                        <input type="checkbox" id="animCheck" onchange="window.accessibilityService.toggleAnimations()">
                        <span data-i18n="animationsLabel">Интерфейс анимациялары</span>
                    </label>
                </div>
                <div class="form-group checkbox-group">
                    <label class="checkbox-label"
                        style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                        <input type="checkbox" id="audioCheck" onchange="window.accessibilityService.toggleAudio()">

                </div>
                <div class="form-group checkbox-group">

                    </label>
