<body class="dark-theme">
    <div id="background-canvas" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;"></div>

    <!-- Cosmic Loading Screen -->
    <div class="loading-wrapper" id="mainLoading">
        <div class="loading-content">
            <div class="cosmic-spinner"></div>
            <p class="loading-text" data-i18n="loadingProfile">Профиль жүктелуде...</p>
        </div>
    </div>



    <!-- Skip Link -->
    <a href="#main-content" class="skip-link visually-hidden-focusable">Негізгі мазмұнға өту</a>

    <!-- Cosmic Navigation -->
    <nav class="cosmic-nav" id="cosmicNav" role="navigation" aria-label="Басты навигация">
        <!-- Desktop Collapse Button -->
        <button class="nav-collapse-btn hide-mobile" id="navCollapseBtn" aria-label="Навигацияны жию"
            title="Панельді жайю">
            <span class="material-symbols-rounded">chevron_left</span>
        </button>

        <div class="nav-header">
            <div class="nav-logo" id="navLogo" aria-hidden="true"><span class="material-symbols-rounded">hub</span>
            </div>
            <div class="nav-tagline" id="navTagline">Neural Constellation</div>
        </div>

        <div class="nav-items" id="navItems" role="menubar">
            <a href="index.html" class="nav-item" role="menuitem">

            </a>
        </div>
    </nav>

    <div class="app-wrapper has-nav" id="appWrapper">
        <header class="app-header" role="banner">
            <div class="container">
                <div class="header-content">
                    <div class="header-main">
                        <h1 class="logo" id="appName">Өзін-өзі тану жүйесі</h1>
                        <p class="tagline" id="tagline">Жеке қалауларды және даму бағыттарын талдау</p>
                    </div>
                    <div class="header-controls">
                        <div class="language-selector" id="languageSelector" aria-label="Тіл таңдау"></div>

                        <!-- Accessibility Button -->
                        <button class="btn-icon header-btn accessibility-trigger" id="accessBtn"
                            aria-label="Қолжетімділік параметрлері" title="Қолжетімділік"
                            onclick="window.accessibilityService.toggleModal(true)">
                            <span class="material-symbols-rounded">accessibility_new</span>
                        </button>

                        <!-- Navigation Toggle (Now in controls) -->
                        <button class="nav-toggle" id="navToggle" aria-label="Навигация мәзірін ашу">
                            <div class="nav-toggle-icon">
                                <span></span>
                                <span></span>
                                <span></span>
                            </div>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <main class="app-main" id="main-content" role="main" aria-label="Профиль мазмұны">
            <div class="container">
                <div id="app" aria-live="polite" aria-atomic="true">
                    <!-- Profile content will be injected here -->
                </div>
            </div>
        </main>

        <footer class="app-footer" role="contentinfo">
            <div class="container">
                <p id="footerText"></p>
                <p class="footer-note" id="footerNote"></p>
            </div>
        </footer>
    </div>

    <!-- Theme Toggle (Floating) -->
    <div class="theme-toggle" id="themeToggle" data-i18n-title="theme" title="Тақырып" role="button" tabindex="0"
        aria-label="Тақырыпты ауыстыру" onkeypress="if(event.key==='Enter') this.click();">
        <span class="theme-icon material-symbols-rounded" aria-hidden="true">light_mode</span>
    </div>

    <!-- Accessibility Modal -->
    <div class="modal" id="accessModal" aria-hidden="true" role="dialog" aria-modal="true"
        aria-labelledby="accessTitle">
        <div class="modal-overlay" onclick="window.accessibilityService.toggleModal(false)"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="accessTitle" data-i18n="accessTitle">Қолжетімділік параметрлері</h3>
                <button class="modal-close" onclick="window.accessibilityService.toggleModal(false)" aria-label="Жабу">
                    <span class="material-symbols-rounded">close</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="contrastSelect" data-i18n="contrastLabel">Контрасттылық</label>
                    <div class="select-wrapper">
                        <select id="contrastSelect" class="form-select"
                            onchange="window.accessibilityService.setContrast(this.value)">
                            <option value="normal" data-i18n="contrastNormal">Қалыпты</option>
                            <option value="high" data-i18n="contrastHigh">Жоғары</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="textSizeSelect" data-i18n="textSizeLabel">Мәтін өлшемі</label>
                    <div class="select-wrapper">
                        <select id="textSizeSelect" class="form-select"
                            onchange="window.accessibilityService.setTextSize(this.value)">
                            <option value="small" data-i18n="textSizeSmall">Кішкентай</option>
                            <option value="normal" data-i18n="textSizeNormal">Қалыпты</option>
                            <option value="large" data-i18n="textSizeLarge">Үлкен</option>
                            <option value="extra-large" data-i18n="textSizeExtraLarge">Өте үлкен</option>
                        </select>
                    </div>
                </div>
                <div class="form-group checkbox-group">
                    <label class="checkbox-label"
                        style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                        <input type="checkbox" id="animCheck" onchange="window.accessibilityService.toggleAnimations()">
                        <span data-i18n="animationsLabel">Інтерфейс анимациялары</span>
                    </label>
                </div>
                <div class="form-group checkbox-group">
                    <label class="checkbox-label"
                        style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                        <input type="checkbox" id="audioCheck" onchange="window.accessibilityService.toggleAudio()">
                        <span data-i18n="audioFeedbackLabel">Дыбыстық сүйемелдеу</span>
                    </label>
                </div>
                <div class="form-group checkbox-group">
                    <label class="checkbox-label"
                        style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                        <input type="checkbox" id="readingCheck" onchange="window.accessibilityService.toggleReading()">
                        <span data-i18n="readingLabel">Нәтижелерді дауыстап оқу</span>
                    </label>
                </div>
            </div>
        </div>
    </div>

    <script src="js/ui/navigation-controller.js" defer></script>

    <!-- Тяжелые библиотеки загружаются лениво через ResourceLoader -->

        window.addEventListener('DOMContentLoaded', () => {
            window.resourceLoader.loadScripts(['https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js'])
                .then(() => console.log('Chart.js loaded in profile'))
                .catch(err => console.error('Error loading Chart.js:', err));

    </script>

    <!-- Main App Logic -->
