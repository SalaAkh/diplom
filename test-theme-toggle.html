<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест переключения темы</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            transition: background-color 0.3s, color 0.3s;
        }

        body.dark-theme {
            background-color: #1a1a2e;
            color: #eee;
        }

        body:not(.dark-theme) {
            background-color: #f5f5f5;
            color: #333;
        }

        .theme-toggle {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s;
        }

        .theme-toggle:hover {
            transform: scale(1.1);
        }

        .theme-icon {
            font-size: 28px;
            color: white;
        }

        .info {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }

        h1 {
            margin-bottom: 20px;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            background: rgba(102, 126, 234, 0.2);
            border-radius: 8px;
            font-family: monospace;
        }
    </style>
</head>

<body class="dark-theme">
    <div class="info">
        <h1>Тест переключения иконок темы</h1>
        <p>Нажмите на кнопку в правом нижнем углу, чтобы переключить тему.</p>
        <p><strong>Ожидаемое поведение:</strong></p>
        <ul>
            <li>Темная тема → иконка солнца (light_mode) ☀️</li>
            <li>Светлая тема → иконка луны (dark_mode) 🌙</li>
        </ul>
        <div class="status">
            <div>Текущая тема: <span id="currentTheme">dark</span></div>
            <div>Текущая иконка: <span id="currentIcon">light_mode</span></div>
        </div>
    </div>

    <!-- Theme Toggle Button -->
    <div class="theme-toggle" id="themeToggle" title="Переключить тему">
        <span class="theme-icon material-symbols-rounded">light_mode</span>
    </div>

    <script>
        // Функция для обновления всех иконок
        function setTheme(theme) {
            localStorage.setItem('theme', theme);
            const icons = document.querySelectorAll('.theme-icon');

            if (theme === 'dark') {
                document.body.classList.add('dark-theme');
                icons.forEach(icon => {
                    if (icon) icon.textContent = 'light_mode'; // Солнце для темной темы
                });
            } else {
                document.body.classList.remove('dark-theme');
                icons.forEach(icon => {
                    if (icon) icon.textContent = 'dark_mode'; // Луна для светлой темы
                });
            }

            // Обновить статус
            updateStatus();
        }

        function updateStatus() {
            const isDark = document.body.classList.contains('dark-theme');
            const icon = document.querySelector('.theme-icon');
            document.getElementById('currentTheme').textContent = isDark ? 'dark' : 'light';
            document.getElementById('currentIcon').textContent = icon ? icon.textContent : 'не найдена';
        }

        // Инициализация
        const themeToggle = document.getElementById('themeToggle');
        const currentTheme = localStorage.getItem('theme') || 'dark';
        setTheme(currentTheme);

        // Обработчик клика
        themeToggle.onclick = () => {
            const isDark = document.body.classList.contains('dark-theme');
            const newTheme = isDark ? 'light' : 'dark';
            setTheme(newTheme);
        };

        // Начальный статус
        updateStatus();
    </script>
</body>

</html>
