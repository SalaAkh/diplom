<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Tests - Self-Knowledge System</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #111;
            color: #eee;
        }

        .test-result {
            margin: 5px 0;
            padding: 5px;
            border-radius: 4px;
        }

        .test-result.passed {
            background: rgba(0, 255, 0, 0.1);
            color: #4f4;
        }

        .test-result.failed {
            background: rgba(255, 0, 0, 0.1);
            color: #f44;
        }

        .status {
            font-weight: bold;
            margin-right: 10px;
        }

        #test-summary {
            font-size: 1.2em;
            margin-bottom: 20px;
            padding: 10px;
            border-bottom: 1px solid #333;
        }
    </style>
</head>

<body>
    <h1>Self-Knowledge System - Unit Tests</h1>
    <div id="test-summary">Running tests...</div>
    <div id="test-results"></div>

    <!-- Core Logic -->
    <script src="js/analysis/analysis.js"></script>
    <script src="js/analysis/evolution-tracker.js"></script>

    <!-- Test Framework -->
    <script src="js/tests/test-runner.js"></script>

    <!-- Tests -->
    <script src="js/tests/analysis-tests.js"></script>
</body>

</html>
